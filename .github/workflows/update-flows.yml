name: Update ETF flow snapshot

on:
  schedule:
    # Daily at 22:30 UTC — ~90 minutes after US market close.
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Run scraper
        run: npm run scrape:flows
      - name: Commit updated snapshot
        run: |
          if [[ -n "$(git status --porcelain data/etf-flows.json)" ]]; then
            git config user.name "etf-flow-compass-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/etf-flows.json
            git commit -m "data: refresh ETF flow snapshot"
            git push
          else
            echo "No changes to commit"
          fi
